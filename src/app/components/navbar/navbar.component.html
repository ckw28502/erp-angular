<mat-toolbar color="primary">
    <mat-toolbar-row>
        <span class="me-12">ERP</span>
        @for (menu of selectedMenu; track menu.url) {
            <a [routerLink]="menu.url">
                <button mat-button>{{ menu.title }}</button>
            </a>
        }
        <span class="spacer"></span>
        @if (isLoggedIn) {
            <button mat-button (click)="logout()" id="btnLogout">Logout</button>
        }
    </mat-toolbar-row>
</mat-toolbar>
